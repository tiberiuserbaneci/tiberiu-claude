<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultron Content Portal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--slate:#191919;--slate2:#222221;--card:#1e1e1d;--ivory:#FAFAF7;--ink70:rgba(250,250,247,.72);--ink46:rgba(250,250,247,.46);--ink30:rgba(250,250,247,.3);--rule:rgba(250,250,247,.1);--book:#CC785C;--book-d:#C84623;--kraft:#D4A27F;--cloud:#919180;--green:#7fae6b;--red:#d9685a;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'DM Sans',sans-serif;}
body{background:#121211;color:var(--ivory);padding:0 0 80px;}
header{position:sticky;top:0;z-index:20;background:rgba(18,18,17,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);padding:18px 30px;}
.htop{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.logo{font-weight:900;font-size:22px;letter-spacing:-.5px;}.logo em{color:var(--book);font-style:normal;}
.sub{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink46);}
.spacer{flex:1;}
.count{font-family:'DM Mono',monospace;font-size:12px;color:var(--ink46);}
.btn{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;color:var(--ink70);background:var(--slate2);border:1px solid var(--rule);border-radius:8px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px;}
.btn:hover{border-color:var(--book);color:var(--ivory);}
.tabs{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.tab{font-weight:700;font-size:14px;color:var(--ink46);background:transparent;border:1px solid var(--rule);border-radius:24px;padding:9px 20px;cursor:pointer;}
.tab.on{color:#1a0f0a;background:var(--book);border-color:var(--book);}
.filters{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;}
.fl{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink46);background:var(--slate2);border:1px solid var(--rule);border-radius:20px;padding:7px 14px;cursor:pointer;}
.fl.on{color:var(--book);border-color:var(--book);background:rgba(204,120,92,.1);}
.fl.rem.on{color:var(--red);border-color:var(--red);background:rgba(217,104,90,.12);}
main{padding:26px 30px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px;}
.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;}
.card.posted{border-color:rgba(127,174,107,.4);}
.card.ref{opacity:.92;}
.pv{position:relative;background:#0e0e0d;display:flex;align-items:center;justify-content:center;min-height:150px;border-bottom:1px solid var(--rule);cursor:pointer;}
.pv img{width:100%;display:block;max-height:340px;object-fit:cover;object-position:top;}
.pv .exp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;opacity:0;background:rgba(10,10,10,.32);color:#fff;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;transition:.15s;}
.pv:hover .exp{opacity:1;}
.badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;}
.bg{font-family:'DM Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:6px;background:rgba(0,0,0,.6);color:var(--ivory);border:1px solid var(--rule);}
.bg.ch{color:var(--book);}.bg.car{color:var(--kraft);}.bg.rev{color:var(--book-d);background:rgba(200,70,35,.18);}.bg.xp{color:var(--kraft);}
.bg.post{position:absolute;top:10px;right:10px;left:auto;color:#0e1a0c;background:var(--green);}
.dimchip{position:absolute;bottom:8px;right:8px;font-family:'DM Mono',monospace;font-size:9px;color:var(--ink70);background:rgba(0,0,0,.62);border:1px solid var(--rule);border-radius:6px;padding:3px 7px;}
.body{padding:15px 16px;display:flex;flex-direction:column;gap:11px;}
.tt{font-weight:800;font-size:17px;letter-spacing:-.3px;}
.meta{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--ink46);display:flex;gap:10px;flex-wrap:wrap;}
.row{display:flex;gap:8px;flex-wrap:wrap;}
.cbox{border:1px solid var(--rule);border-radius:10px;overflow:hidden;}
.cbox .ch{display:flex;align-items:center;justify-content:space-between;padding:7px 11px;background:var(--slate2);}
.cbox .ch span{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink46);}
.cbox textarea{width:100%;border:none;background:transparent;color:var(--ink70);font-size:12.5px;line-height:1.45;padding:10px 11px;resize:vertical;min-height:54px;max-height:150px;font-family:'DM Sans',sans-serif;}
.cprev{white-space:pre-wrap;word-break:break-word;color:var(--ink70);font-size:13px;line-height:1.5;padding:12px;max-height:320px;overflow:auto;}
.cprev .muted{color:var(--ink30);font-style:italic;}
.copy{font-family:'DM Mono',monospace;font-size:10px;color:var(--book);background:none;border:1px solid var(--book);border-radius:6px;padding:4px 10px;cursor:pointer;}
.copy.ok{color:#0e1a0c;background:var(--green);border-color:var(--green);}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:11px;margin-top:2px;}
.toggle{font-weight:700;font-size:13px;border-radius:9px;padding:9px 16px;cursor:pointer;border:1px solid var(--rule);background:var(--slate2);color:var(--ink70);}
.toggle.on{background:var(--green);color:#0e1a0c;border-color:var(--green);}
.del{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink46);background:none;border:1px solid var(--rule);border-radius:8px;padding:8px 12px;cursor:pointer;}
.del:hover{color:var(--red);border-color:var(--red);}
.restore{font-weight:700;font-size:13px;border-radius:9px;padding:9px 16px;cursor:pointer;border:1px solid var(--book);background:rgba(204,120,92,.1);color:var(--book);}
.mini{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--ink46);}
.up{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--book);cursor:pointer;border:1px dashed var(--book);border-radius:8px;padding:7px 11px;}
input[type=file]{display:none;}
.empty{color:var(--ink46);text-align:center;padding:80px;font-family:'DM Mono',monospace;}
a.dl{color:var(--ivory);}
/* ---- lightbox ---- */
.lb{position:fixed;inset:0;z-index:100;background:rgba(8,8,8,.94);backdrop-filter:blur(7px);display:none;}
.lb.on{display:flex;}
.lb-inner{flex:1;display:flex;min-height:0;min-width:0;}
.lb-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:30px;min-width:0;}
.lb-stage img{max-width:100%;max-height:calc(100vh - 60px);object-fit:contain;border-radius:8px;box-shadow:0 14px 60px rgba(0,0,0,.6);}
.lb-stage iframe{position:absolute;top:50%;left:50%;transform-origin:center center;border:none;border-radius:8px;background:var(--slate);box-shadow:0 14px 60px rgba(0,0,0,.6);}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid var(--rule);color:var(--ivory);font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;z-index:2;}
.lb-nav:hover{background:var(--book);color:#1a0f0a;border-color:var(--book);}
.lb-nav.prev{left:18px;}.lb-nav.next{right:18px;}
.lb-nav.hidden{display:none;}
.lb-dims,.lb-count{position:absolute;bottom:18px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.04em;color:var(--ivory);background:rgba(0,0,0,.62);border:1px solid var(--rule);border-radius:8px;padding:7px 12px;z-index:2;}
.lb-dims{left:18px;}.lb-count{right:18px;}
.lb-dots{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:7px;z-index:2;}
.lb-dot{width:8px;height:8px;border-radius:50%;background:rgba(250,250,247,.3);cursor:pointer;border:none;padding:0;}
.lb-dot.on{background:var(--book);}
.lb-side{width:440px;flex-shrink:0;border-left:1px solid var(--rule);background:#121211;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:15px;}
.lb-title{font-weight:900;font-size:24px;letter-spacing:-.5px;line-height:1.15;}
.lb-id{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink46);word-break:break-all;}
.lb-chips{display:flex;gap:6px;flex-wrap:wrap;}
.lb-chips .bg{position:static;}
.lb-note{font-family:'DM Mono',monospace;font-size:11px;color:var(--kraft);background:rgba(212,162,127,.1);border:1px solid var(--rule);border-radius:8px;padding:8px 11px;}
.lb-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.lb-close{position:absolute;top:14px;right:16px;z-index:6;font-family:'DM Mono',monospace;font-size:12px;color:var(--ivory);background:rgba(0,0,0,.5);border:1px solid var(--rule);border-radius:8px;padding:9px 14px;cursor:pointer;}
.lb-close:hover{border-color:var(--book);color:var(--book);}
@media(max-width:820px){.lb-inner{flex-direction:column;}.lb-side{width:100%;border-left:none;border-top:1px solid var(--rule);}.lb-stage{min-height:48vh;}}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);z-index:200;background:var(--slate2);border:1px solid var(--book);color:var(--ivory);font-family:'DM Mono',monospace;font-size:12.5px;padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style></head><body>
<header>
 <div class="htop">
  <div class="logo">ULTRON <em>Content Portal</em></div>
  <div class="sub" id="gen">loading</div>
  <div class="spacer"></div>
  <span class="count" id="count"></span>
  <button class="btn" onclick="rescan()">&#8635; Rescan</button>
 </div>
 <div class="tabs" id="tabs"></div>
 <div class="filters" id="filters"></div>
</header>
<main><div class="grid" id="grid"></div><div class="empty" id="empty" style="display:none">No materials match.</div></main>

<div class="lb" id="lb" onclick="lbBg(event)">
 <div class="lb-inner">
  <div class="lb-stage">
   <button class="lb-nav prev" onclick="slide(-1)" title="Previous (left arrow)">&#8249;</button>
   <img id="lb-img" alt="">
   <iframe id="lb-frame" style="display:none" title="preview"></iframe>
   <button class="lb-nav next" onclick="slide(1)" title="Next (right arrow)">&#8250;</button>
   <div class="lb-dims" id="lb-dims"></div>
   <div class="lb-count" id="lb-count"></div>
   <div class="lb-dots" id="lb-dots"></div>
  </div>
  <aside class="lb-side" id="lb-side"></aside>
 </div>
 <button class="lb-close" onclick="closeLB()">close &#10005;</button>
</div>
<div id="toast"></div>

<script>
let DATA=null, channel='all', filters=new Set(), LB=null;
const FILTERS=[['posted','Posted'],['unposted','Not posted'],['carousel','Carousels'],['caption','Has caption'],['needs-revision','Needs revision'],['generated','Generated'],['crosspost','Cross-posts'],['removed','Removed']];
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function dlname(m){const ext=m.download.split('.').pop();return `${slug(m.title)}-${m.channel}-${m.generated_date}.${ext}`;}
function dllabel(m){if((m.download||'').endsWith('.pdf'))return `Download PDF (${m.slides} slides)`;return m.type==='carousel'?`Download all ${m.slides} slides`:'Download';}
async function load(){
 let data;
 try{
  const r=await fetch('/manifest.json?'+Date.now(),{cache:'no-store'});
  if(!r.ok) throw 0;
  data=await r.json();
 }catch(e){
  const g=document.getElementById('gen'); if(g) g.textContent='connecting to portal...';
  return setTimeout(load,1500);   // server waking up (Codespace restart) - keep retrying so the page self-recovers
 }
 DATA=data; DATA.deleted=DATA.deleted||[];
 render();
 if(LB){curMat()?renderLB():closeLB();}
}

// newest generated_date first (top-left); id is a stable tie-breaker for same-day items
function byNewest(a,b){return (b.generated_date||'').localeCompare(a.generated_date||'')||(a.id<b.id?-1:a.id>b.id?1:0);}
function render(){
 document.getElementById('gen').textContent='generated '+DATA.generated_at.replace('T',' ');
 const tabs=document.getElementById('tabs');
 const chans=[['all','All'],['linkedin','LinkedIn'],['tiktok','TikTok'],['instagram','Instagram']];
 const pool=filters.has('removed')?DATA.deleted:DATA.materials;
 tabs.innerHTML=chans.map(([k,l])=>{const n=pool.filter(m=>k==='all'||m.channel===k).length;return `<button class="tab ${channel===k?'on':''}" onclick="setCh('${k}')">${l} <span style="opacity:.6">${n}</span></button>`}).join('');
 document.getElementById('filters').innerHTML=FILTERS.map(([k,l])=>{const dn=DATA.deleted.length;const extra=(k==='removed'&&dn)?` <span style="opacity:.6">${dn}</span>`:'';return `<button class="fl ${k==='removed'?'rem':''} ${filters.has(k)?'on':''}" onclick="tg('${k}')">${l}${extra}</button>`}).join('');

 if(filters.has('removed')){
  let list=DATA.deleted.filter(m=>channel==='all'||m.channel===channel).sort(byNewest);
  document.getElementById('count').textContent=list.length+' removed';
  document.getElementById('empty').style.display=list.length?'none':'block';
  document.getElementById('grid').innerHTML=list.map(remCard).join('');
  return;
 }
 let list=DATA.materials.filter(m=>channel==='all'||m.channel===channel);
 if(filters.has('posted'))list=list.filter(m=>m.posted);
 if(filters.has('unposted'))list=list.filter(m=>!m.posted);
 if(filters.has('carousel'))list=list.filter(m=>m.type==='carousel');
 if(filters.has('caption'))list=list.filter(m=>m.caption);
 if(filters.has('needs-revision'))list=list.filter(m=>m.status==='needs-revision');
 if(filters.has('generated'))list=list.filter(m=>m.source==='generated');
 if(filters.has('crosspost'))list=list.filter(m=>m.source==='crosspost');
 list.sort(byNewest);
 document.getElementById('count').textContent=list.length+' materials';
 document.getElementById('empty').style.display=list.length?'none':'block';
 document.getElementById('grid').innerHTML=list.map(card).join('');
}
function setCh(c){channel=c;render();}
// opposite pairs can never both be active (posted AND not-posted = empty); picking one drops its opposite
const EXCL={posted:'unposted',unposted:'posted',generated:'crosspost',crosspost:'generated'};
function tg(f){
 if(f==='removed'&&!filters.has('removed')){filters.clear();}else{filters.delete('removed');}
 if(filters.has(f)){filters.delete(f);}else{filters.add(f);if(EXCL[f])filters.delete(EXCL[f]);}
 render();
}

function cbox(label,txt){if(!txt)return '';const id='t'+Math.random().toString(36).slice(2);
 return `<div class="cbox"><div class="ch"><span>${label}</span><button class="copy" onclick="cp(this,'${id}')">copy</button></div><textarea id="${id}" readonly>${esc(txt)}</textarea></div>`;}

function card(m){
 const car=m.type==='carousel';
 const dl=`<a class="btn dl" href="/${m.download}" download="${dlname(m)}">&#8681; ${dllabel(m)}</a>`;
 const other=m.channel==='linkedin'?'tiktok':'linkedin';
 const cross=m.channel!=='instagram'?`<button class="btn" onclick="crosspostNow('${m.id}','${other}')">&#8644; Copy to ${cap(other)}</button>`:'';
 const an=m.posted?`<label class="up">${m.analytics?('analytics: '+m.analytics.split('/').pop()):'&#8682; upload analytics (csv/xls)'}<input type="file" accept=".csv,.xls,.xlsx" onchange="upAnalytics('${m.id}',this)"></label>`:'';
 const xp=(m.crossposts&&m.crossposts.length)?`<span class="mini" style="color:var(--kraft)">also on ${m.crossposts.join(', ')}</span>`:'';
 const xpbadge=m.source==='crosspost'?'<span class="bg xp">cross-post</span>':'';
 return `<div class="card ${m.posted?'posted':''} ${m.source==='reference'?'ref':''}">
  <div class="pv" onclick="openLB('${m.id}')">${m.preview?`<img loading="lazy" src="/${m.preview}">`:'<div class="empty">no preview</div>'}
   <div class="exp">&#11042; open full screen</div>
   <div class="badges"><span class="bg ch">${m.channel}</span>${car?`<span class="bg car">${m.slides} slides</span>`:''}${xpbadge}${m.status==='needs-revision'?'<span class="bg rev">needs revision</span>':''}</div>
   ${m.dims?`<span class="dimchip">${m.dims}</span>`:''}
   ${m.posted?'<span class="bg post">posted</span>':''}</div>
  <div class="body">
   <div class="tt">${esc(m.title)}</div>
   <div class="meta"><span>${m.id}</span><span>&#9679; ${m.generated_date}</span><span>&#9679; ${m.type}</span></div>
   <div class="row">${dl}${cross}</div>
   ${cbox('Caption',m.caption)}${cbox('ALT text',m.alt)}${cbox('First comment',m.first_comment)}
   <div class="toolbar">
     <button class="toggle ${m.posted?'on':''}" onclick="togglePosted('${m.id}',${!m.posted})">${m.posted?'&#10003; Posted':'Mark posted'}</button>
     ${m.posted&&m.posted_date?`<span class="mini">on ${m.posted_date}</span>`:''}
     ${an} ${xp}
     <button class="del" onclick="deleteMat('${m.id}',false)" title="Remove from portal">&#128465; delete</button>
   </div>
  </div></div>`;
}
function remCard(m){
 return `<div class="card ref">
  <div class="pv">${m.preview?`<img loading="lazy" src="/${m.preview}">`:'<div class="empty">no preview</div>'}
   <div class="badges"><span class="bg ch">${m.channel}</span>${m.source==='crosspost'?'<span class="bg xp">cross-post</span>':''}</div>
   ${m.dims?`<span class="dimchip">${m.dims}</span>`:''}</div>
  <div class="body">
   <div class="tt">${esc(m.title)}</div>
   <div class="meta"><span>${m.id}</span>${m.deleted_date?`<span>&#9679; removed ${m.deleted_date}</span>`:''}</div>
   <div class="toolbar"><button class="restore" onclick="restoreMat('${m.id}')">&#8634; Restore</button></div>
  </div></div>`;
}

/* ---- lightbox ---- */
function curMat(){return LB?DATA.materials.find(m=>m.id===LB.id):null;}
function lbSlides(m){
 if(m.type==='carousel')return m.files.map(f=>({t:'img',src:f}));
 if(m.source==='reference'&&(m.files&&(m.files[0]||'').endsWith('.html')))return [{t:'frame',src:m.files[0]}];
 return [{t:'img',src:m.preview}];
}
function nativeWH(m){const d=m.dims||'';const x=d.match(/\((\d+)x(\d+)\s*@2x\)/)||d.match(/(\d+)x(\d+)/);if(x)return {w:+x[1],h:+x[2]};return {w:1080,h:m.channel==='linkedin'?1450:1920};}
function fitFrame(){const m=curMat();if(!m)return;const wh=nativeWH(m);const stage=document.querySelector('.lb-stage');if(!stage)return;const s=Math.min((stage.clientWidth-40)/wh.w,(stage.clientHeight-40)/wh.h);document.getElementById('lb-frame').style.transform=`translate(-50%,-50%) scale(${s})`;}
function openLB(id){LB={id,idx:0};document.getElementById('lb').classList.add('on');document.body.style.overflow='hidden';renderLB();}
function closeLB(){LB=null;document.getElementById('lb').classList.remove('on');document.body.style.overflow='';document.getElementById('lb-frame').src='about:blank';}
function lbBg(e){if(e.target.id==='lb'||e.target.classList.contains('lb-inner'))closeLB();}
function slide(d){const m=curMat();if(!m)return;const s=lbSlides(m);LB.idx=(LB.idx+d+s.length)%s.length;paintSlide();}
function paintSlide(){
 const m=curMat();if(!m)return;const s=lbSlides(m);const cur=s[LB.idx];
 const img=document.getElementById('lb-img'),fr=document.getElementById('lb-frame');
 if(cur.t==='frame'){
  img.style.display='none';fr.style.display='block';
  const wh=nativeWH(m);fr.style.width=wh.w+'px';fr.style.height=wh.h+'px';
  if(fr.getAttribute('src')!=='/'+cur.src){fr.src='/'+cur.src;fr.onload=fitFrame;}
  fitFrame();
 }
 else{fr.style.display='none';fr.src='about:blank';img.style.display='block';img.src='/'+cur.src;}
 const cnt=document.getElementById('lb-count');cnt.style.display=s.length>1?'block':'none';cnt.textContent=(LB.idx+1)+' / '+s.length;
 document.querySelectorAll('.lb-nav').forEach(b=>b.classList.toggle('hidden',s.length<2));
 const dots=document.getElementById('lb-dots');dots.innerHTML=s.length>1?s.map((_,i)=>`<button class="lb-dot ${i===LB.idx?'on':''}" onclick="LB.idx=${i};paintSlide()"></button>`).join(''):'';
 const dim=document.getElementById('lb-dims');
 const setdim=v=>{dim.textContent=v||'';dim.style.display=v?'block':'none';};
 if(m.dims)setdim(m.dims);
 else if(cur.t==='img'){setdim('');img.onload=()=>setdim(img.naturalWidth+'x'+img.naturalHeight);}
 else setdim('');
}
function tblock(label,field,m){const v=m[field]||'';
 return `<div class="cbox"><div class="ch"><span>${label}</span>${v?`<button class="copy" onclick="cpText(this,'${field}')">copy</button>`:''}</div><div class="cprev">${v?esc(v):'<span class="muted">none yet</span>'}</div></div>`;}
function renderLB(){
 const m=curMat();if(!m){closeLB();return;}
 const other=m.channel==='linkedin'?'tiktok':'linkedin';
 const cross=m.channel!=='instagram'?`<button class="btn" onclick="crosspostNow('${m.id}','${other}')">&#8644; Copy to ${cap(other)}</button>`:'';
 const origin=m.source==='crosspost'?`<div class="lb-note">cross-post of <strong>${esc(m.origin)}</strong> - same asset, ${cap(m.channel)} channel</div>`:'';
 const xp=(m.crossposts&&m.crossposts.length)?`<div class="lb-note">also cross-posted to ${m.crossposts.join(', ')}</div>`:'';
 const an=m.posted?`<label class="up">${m.analytics?('analytics: '+m.analytics.split('/').pop()):'&#8682; upload analytics (csv/xls)'}<input type="file" accept=".csv,.xls,.xlsx" onchange="upAnalytics('${m.id}',this)"></label>`:'';
 document.getElementById('lb-side').innerHTML=`
  <div class="lb-title">${esc(m.title)}</div>
  <div class="lb-id">${m.id}</div>
  <div class="lb-chips">
   <span class="bg ch">${m.channel}</span><span class="bg">${m.type}</span>
   ${m.dims?`<span class="bg">${m.dims}</span>`:''}
   ${m.slides>1?`<span class="bg car">${m.slides} slides</span>`:''}
   ${m.source==='crosspost'?'<span class="bg xp">cross-post</span>':''}
   ${m.status==='needs-revision'?'<span class="bg rev">needs revision</span>':''}
   ${m.posted?'<span class="bg post" style="position:static">posted</span>':''}
  </div>
  <div class="meta"><span>&#9679; ${m.generated_date}</span>${m.posted_date?`<span>&#9679; posted ${m.posted_date}</span>`:''}</div>
  ${origin}${xp}
  <div class="lb-actions">
   <a class="btn dl" href="/${m.download}" download="${dlname(m)}">&#8681; ${dllabel(m)}</a>
   ${cross}
  </div>
  <div class="lb-actions">
   <button class="toggle ${m.posted?'on':''}" onclick="togglePosted('${m.id}',${!m.posted})">${m.posted?'&#10003; Posted':'Mark posted'}</button>
   <button class="del" onclick="deleteMat('${m.id}',true)">&#128465; Delete</button>
  </div>
  ${an}
  ${tblock('Caption','caption',m)}
  ${tblock('ALT text','alt',m)}
  ${tblock('First comment','first_comment',m)}`;
 paintSlide();
}

function cp(btn,id){const t=document.getElementById(id);navigator.clipboard.writeText(t.value).then(()=>flash(btn));}
function cpText(btn,field){const m=curMat();if(!m)return;navigator.clipboard.writeText(m[field]||'').then(()=>flash(btn));}
function flash(btn){const o=btn.textContent;btn.textContent='copied';btn.classList.add('ok');setTimeout(()=>{btn.textContent=o;btn.classList.remove('ok');},1200);}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2400);}

async function api(path,body){return (await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();}
async function togglePosted(id,val){await api('/api/save',{id,patch:{posted:val,posted_date:val?new Date().toISOString().slice(0,10):null}});await load();}
async function crosspostNow(id,target){const r=await api('/api/crosspost',{id,target});await load();toast(r.already?('Already on '+cap(target)+' - see the '+cap(target)+' tab'):('Copied to '+cap(target)+' - see the '+cap(target)+' tab'));}
async function deleteMat(id,fromLB){if(!confirm('Remove this material from the portal?\n\nThe source file stays in the repo - find it under the "Removed" filter and Restore it anytime.'))return;await api('/api/delete',{id});if(fromLB)closeLB();await load();toast('Removed - undo it under the Removed filter');}
async function restoreMat(id){await api('/api/restore',{id});await load();toast('Restored');}
async function upAnalytics(id,inp){const f=inp.files[0];if(!f)return;await fetch(`/api/analytics?id=${encodeURIComponent(id)}&filename=${encodeURIComponent(f.name)}`,{method:'POST',body:f});await load();toast('Analytics uploaded');}
async function rescan(){document.getElementById('count').textContent='rescanning...';await fetch('/api/rescan',{method:'POST'});await load();toast('Rescanned');}

document.addEventListener('keydown',e=>{if(!LB)return;if(e.key==='Escape')closeLB();else if(e.key==='ArrowLeft')slide(-1);else if(e.key==='ArrowRight')slide(1);});
window.addEventListener('resize',()=>{const m=curMat();if(!m)return;const s=lbSlides(m)[LB.idx];if(s&&s.t==='frame')fitFrame();});
load();
</script></body></html>
