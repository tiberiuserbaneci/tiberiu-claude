* { box-sizing: border-box; margin: 0; padding: 0 }
body { background: #000; display: flex; justify-content: center;
  font-family: 'DM Sans', sans-serif; }
#film { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #000 }
.card { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; z-index: 1 }

.band {
  position: absolute; left: 0; top: 0; width: 1080px; height: 180px;
  background: linear-gradient(to bottom, #1c1c1c, #2b2b2b); z-index: 5;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.band .l1, .band .l2 { font-weight: 800; font-size: 42px; line-height: 1.08;
  letter-spacing: -0.9px; color: #FFFFFF; white-space: nowrap }
.band .sub { font-weight: 700; font-size: 29px; line-height: 1.15; letter-spacing: -0.4px;
  color: #FFFFFF; margin-top: 5px; white-space: nowrap }

.edge { position: absolute; left: 0; right: 0; top: 180px; height: 3px;
  background: #111; z-index: 6; pointer-events: none }
.pic { position: absolute; left: 0; top: 180px; width: 1080px; height: 1170px;
  background: #f6f8fc; z-index: 1; overflow: hidden }

.cta-btn {
  position: absolute; left: 50%; transform: translateX(-50%); top: 1180px;
  background: rgba(255,255,255,0.90);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 2px solid #FFFFFF;
  box-shadow: 0 12px 28px rgba(15,23,42,0.14), 0 4px 10px rgba(15,23,42,0.08),
    inset 0 1px 1px rgba(255,255,255,0.95);
  border-radius: 999px; padding: 15px 42px;
  display: flex; align-items: center; justify-content: center; z-index: 3;
}
.cta-btn .txt { font-weight: 700; font-size: 27px; line-height: 1; color: #0F172A;
  letter-spacing: -0.3px; white-space: nowrap }
.cta-btn .kw { color: #EA580C; font-weight: 800; margin: 0 6px }

.veil { position: absolute; left: 0; top: 180px; width: 1080px; height: 1170px;
  background: #000; opacity: 0.982; z-index: 4; pointer-events: none;
  animation: up 4.2s linear forwards 0s }
@keyframes up { from { opacity: 0.982 } to { opacity: 0 } }

/* the layout, in the picture */
#art { width: 1080px; height: 1170px; background: #f6f8fc; position: relative;
  overflow: hidden; padding: 56px 70px 194px }

:root{--ink:#111;--muted:#77736B;--book:#C84623;--hair:rgba(17,17,17,.11);--tile:#F5F4F1}
*{margin:0;padding:0;box-sizing:border-box}

.tl{background:var(--tile);border:1px solid var(--hair);display:inline-flex;
  align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.tl .lg{display:flex;color:#1A1A18}.tl .lg svg{width:100%;height:100%}
.tl.mono{font-weight:800;color:#4A4844}
.tl.lk{background:rgba(200,70,35,.08);border-color:rgba(200,70,35,.30);color:var(--book);
  font-weight:800}
.hd{font-family:'DM Mono',monospace;font-size:14px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);margin-bottom:26px}
.hd b{color:var(--book);font-weight:500}

.ph{display:flex;justify-content:center}
.scr{width:820px;height:880px;border-radius:52px;background:#F0EEE9;
  border:1px solid var(--hair);padding:56px 44px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:34px 30px;align-content:start;
  justify-items:center}
.a{display:flex;flex-direction:column;align-items:center;gap:11px}
.a .tl{background:#fff}
.n{font-size:20px;font-weight:700;letter-spacing:-.3px}
